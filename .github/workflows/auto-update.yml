name: Auto-Update Firmware Support

on:
  repository_dispatch:
    types: [firmware_update]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract dispatch payload
        run: |
          FW_VERSION="${{ github.event.client_payload.fw_version }}"
          DATE_STRING="${{ github.event.client_payload.date_string }}"

          if [ -z "$FW_VERSION" ] || [ -z "$DATE_STRING" ]; then
            echo "ERROR: Missing fw_version or date_string in payload"
            exit 1
          fi

          # Version hex = major * 0x100 (e.g. 23.0.0 → 23 * 256 = 0x1700)
          MAJOR=$(echo "$FW_VERSION" | cut -d. -f1)
          NEW_HEX=$(python3 -c "print(hex($MAJOR * 0x100))")

          echo "FW_VERSION=$FW_VERSION" >> $GITHUB_ENV
          echo "DATE_STRING=$DATE_STRING" >> $GITHUB_ENV
          echo "NEW_HEX=$NEW_HEX" >> $GITHUB_ENV

          echo "Firmware : $FW_VERSION"
          echo "Date     : $DATE_STRING"
          echo "Hex      : $NEW_HEX"

      - name: Check if already known
        run: |
          DATE="${{ env.DATE_STRING }}"
          if grep -qF "\"$DATE\"" source/warmboot/warmboot_extractor.c; then
            echo "Date string $DATE already present in source. Nothing to do."
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Patch warmboot_extractor.c
        if: env.SKIP == 'false'
        run: python3 .github/scripts/patch_firmware.py

      - name: Bump Versions.inc patch number
        if: env.SKIP == 'false'
        run: python3 .github/scripts/bump_version.py

      - name: Create branch, commit and open PR
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FW="${{ env.FW_VERSION }}"
          DATE="${{ env.DATE_STRING }}"
          HEX="${{ env.NEW_HEX }}"
          BRANCH="auto-fw-update/$FW"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # If branch already exists, delete and recreate
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"

          git add source/warmboot/warmboot_extractor.c Versions.inc
          git commit -m "feat: add $FW firmware support ($DATE -> $HEX)"
          git push origin "$BRANCH"

          printf '%s\n' \
            '## Auto-generated firmware update' \
            '' \
            "New firmware **$FW** detected by AutoFW pipeline." \
            '' \
            '| Field | Value |' \
            '|---|---|' \
            "| Firmware version | \`$FW\` |" \
            "| Package1 date string | \`$DATE\` |" \
            "| Version hex | \`$HEX\` |" \
            '' \
            '### Changes' \
            "- Added \`\"$DATE\"\` → \`$HEX\` to \`get_target_firmware_from_pkg1\` in \`warmboot_extractor.c\`" \
            '- Bumped version patch number in \`Versions.inc\`' \
            '' \
            'Please review and merge.' > /tmp/pr_body.md

          gh pr create \
            --title "feat: add $FW firmware support" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head "$BRANCH"

          echo "PR created for firmware $FW"
