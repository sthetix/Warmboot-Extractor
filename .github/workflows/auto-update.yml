name: Auto-Update Firmware Support

on:
  repository_dispatch:
    types: [firmware_update]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract dispatch payload
        run: |
          FW_VERSION="${{ github.event.client_payload.fw_version }}"
          DATE_STRING="${{ github.event.client_payload.date_string }}"

          if [ -z "$FW_VERSION" ] || [ -z "$DATE_STRING" ]; then
            echo "ERROR: Missing fw_version or date_string in payload"
            exit 1
          fi

          # Version hex = major * 0x100 (e.g. 23.0.0 → 23 * 256 = 0x1700)
          MAJOR=$(echo "$FW_VERSION" | cut -d. -f1)
          NEW_HEX=$(python3 -c "print(hex($MAJOR * 0x100))")

          echo "FW_VERSION=$FW_VERSION" >> $GITHUB_ENV
          echo "DATE_STRING=$DATE_STRING" >> $GITHUB_ENV
          echo "NEW_HEX=$NEW_HEX" >> $GITHUB_ENV

          echo "Firmware : $FW_VERSION"
          echo "Date     : $DATE_STRING"
          echo "Hex      : $NEW_HEX"

      - name: Check if already known
        run: |
          DATE="${{ env.DATE_STRING }}"
          if grep -qF "\"$DATE\"" source/warmboot/warmboot_extractor.c; then
            echo "Date string $DATE already present in source. Nothing to do."
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Patch warmboot_extractor.c
        if: env.SKIP == 'false'
        run: |
          python3 - <<'EOF'
import re, os, sys

date_string = os.environ['DATE_STRING']
new_hex     = os.environ['NEW_HEX']
fw_version  = os.environ['FW_VERSION']

with open('source/warmboot/warmboot_extractor.c', 'r') as f:
    content = f.read()

new_line = f'            if (memcmp(package1 + 0x10, "{date_string}", 8) == 0) return {new_hex}; // {fw_version}'

# Match every existing memcmp line in the firmware detection block
pattern = r'(            if \(memcmp\(package1 \+ 0x10, "[0-9]+", 8\) == 0\) return 0x[0-9a-fA-F]+; // [^\n]+\n)'
matches = list(re.finditer(pattern, content))

if not matches:
    print("ERROR: Could not find insertion point in warmboot_extractor.c")
    sys.exit(1)

# Insert after the last known entry
last_match = matches[-1]
content = content[:last_match.end()] + new_line + '\n' + content[last_match.end():]

with open('source/warmboot/warmboot_extractor.c', 'w') as f:
    f.write(content)

print(f"Inserted: {new_line}")
EOF

      - name: Bump Versions.inc patch number
        if: env.SKIP == 'false'
        run: |
          python3 - <<'EOF'
import re

with open('Versions.inc', 'r') as f:
    content = f.read()

new_content = re.sub(
    r'(LPVERSION_BUGFX = )(\d+)',
    lambda m: m.group(1) + str(int(m.group(2)) + 1),
    content
)

with open('Versions.inc', 'w') as f:
    f.write(new_content)

# Print new version for log
major = re.search(r'LPVERSION_MAJOR = (\d+)', new_content).group(1)
minor = re.search(r'LPVERSION_MINOR = (\d+)', new_content).group(1)
bugfx = re.search(r'LPVERSION_BUGFX = (\d+)', new_content).group(1)
print(f"Version bumped to {major}.{minor}.{bugfx}")
EOF

      - name: Create branch, commit and open PR
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FW="${{ env.FW_VERSION }}"
          DATE="${{ env.DATE_STRING }}"
          HEX="${{ env.NEW_HEX }}"
          BRANCH="auto-fw-update/$FW"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # If branch already exists, delete and recreate
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"

          git add source/warmboot/warmboot_extractor.c Versions.inc
          git commit -m "feat: add $FW firmware support ($DATE -> $HEX)"
          git push origin "$BRANCH"

          gh pr create \
            --title "feat: add $FW firmware support" \
            --body "$(cat <<PREOF
## Auto-generated firmware update

New firmware **$FW** detected by AutoFW pipeline.

| Field | Value |
|---|---|
| Firmware version | \`$FW\` |
| Package1 date string | \`$DATE\` |
| Version hex | \`$HEX\` |

### Changes
- Added \`"$DATE"\` → \`$HEX\` to \`get_target_firmware_from_pkg1\` in \`warmboot_extractor.c\`
- Bumped version patch number in \`Versions.inc\`

Please review and merge.
PREOF
)" \
            --base main \
            --head "$BRANCH"

          echo "PR created for firmware $FW"
